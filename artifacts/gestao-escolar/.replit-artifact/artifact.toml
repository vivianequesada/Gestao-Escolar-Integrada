kind = "web"
previewPath = "/"
title = "Gestão Escolar"
description = "Sistema escolar em Python com Streamlit para quadro de avisos, agendamento de quadra e informática, e relatórios de inclusão AEE."
version = "1.0.0"
id = "artifacts/gestao-escolar"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/_stcore/stream" ]
localPort = 23667

[services.development]
run = "pnpm --filter @workspace/gestao-escolar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gestao-escolar", "run", "build" ]
serve = "static"
publicDir = "artifacts/gestao-escolar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23667"
BASE_PATH = "/"
